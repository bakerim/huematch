name: myapp
description: "HueMatch: A colorful, geometric, and addictive matching puzzle game that tests memory and attention skills!"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  google_mobile_ads: ^7.0.0
  in_app_review: ^2.0.9
  flutter_local_notifications: ^17.1.2  
  timezone: ^0.9.2 
  url_launcher: ^6.2.5
  audioplayers: ^6.1.0
  flutter_native_splash: ^2.4.7
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  

flutter:
  uses-material-design: true
  assets:
    - assets/image/moving_pixel.png
    - assets/image/huematch.png
    - assets/sounds/
    - assets/translations/
    
flutter_native_splash:
  color: "#F8F9FA"
  image: assets/image/moving_pixel.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#F8F9FA"
    image: assets/image/moving_pixel.png
    android_gravity: center
    ios_content_mode: center

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/image/huematch.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/image/huematch.png"
    background_color: "#F8F9FA"
    theme_color: "#F8F9FA"
